name: HiFi CI — amd
'on':
  push:
    branches:
    - merawala
  pull_request:
    branches:
    - merawala
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
    - name: Build Docker image
      run: docker build -t amd .
